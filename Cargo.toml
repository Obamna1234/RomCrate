[workspace]
resolver = "2"
members = ["crates/romcrate-core", "crates/romcrate-cli", "src-tauri"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Obamna1234/RomCrate"
authors = ["RomCrate contributors"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "fs", "time", "process", "io-util"] }
anyhow = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3

# Image work is slow unoptimised; speed up dependencies in debug/test builds.
[profile.dev.package."*"]
opt-level = 2

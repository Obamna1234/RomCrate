[workspace]
resolver = "2"
members = ["crates/shelfart-core", "crates/shelfart-cli", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Obamna1234/ShelfArt"
authors = ["ShelfArt contributors"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "fs", "time", "process"] }
anyhow = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3

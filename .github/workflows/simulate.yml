name: Real-user simulation

# Acts like a user on real Windows, macOS and Linux machines: builds the current
# code, makes a messy test collection, scrapes it live from the internet with the
# command line AND the app window, and keeps every log, cover and screenshot for review.

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1" # weekly, catches upstream art/database changes

permissions:
  contents: read

env:
  ROMS_NAME: "Odin's Portal 2 Emulator ROMs (copy) – test"
  PYTHONUTF8: "1"

jobs:
  cli:
    name: CLI (${{ matrix.os }})
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Build CLI
        run: cargo build --release -p romcrate-cli
      - name: Make test collection
        run: |
          python -m pip install --quiet pycdlib
          python tools/simulate/make_fixtures.py "$RUNNER_TEMP/sim/$ROMS_NAME"
      - name: Scrape like a user
        run: |
          set -o pipefail
          B=target/release/romcrate-cli
          R="$RUNNER_TEMP/sim/$ROMS_NAME"
          O="$RUNNER_TEMP/sim/out"; mkdir -p "$O"
          $B scan "$R"                                       2>&1 | tee "$O/1-scan.log"
          $B scrape --roms "$R" --launcher pegasus --pegasus-on android 2>&1 | tee "$O/2-pegasus.log"
          $B scrape --roms "$R" --launcher pegasus --pegasus-on android 2>&1 | tee "$O/3-pegasus-rerun.log"
          $B scrape --roms "$R" --launcher es-de --folder "$RUNNER_TEMP/sim/ES-DE/downloaded_media" 2>&1 | tee "$O/4-esde.log"
      - name: Check results
        if: always()
        run: python tools/simulate/check.py "$RUNNER_TEMP/sim" | tee "$RUNNER_TEMP/sim/out/5-check.log"
      - name: Get Android's USB tool from Google (checksum-verified) and run it
        if: always()
        run: |
          set -o pipefail
          B=target/release/romcrate-cli
          mkdir -p "$RUNNER_TEMP/sim/out"
          $B usb-tool install 2>&1 | tee "$RUNNER_TEMP/sim/out/7-usb-tool.log"
          $B usb-tool status  2>&1 | tee -a "$RUNNER_TEMP/sim/out/7-usb-tool.log"
          grep -q "Checksum matches Google's list" "$RUNNER_TEMP/sim/out/7-usb-tool.log"
          grep -q "Android Debug Bridge version" "$RUNNER_TEMP/sim/out/7-usb-tool.log"

      - name: Import & sort like a user
        if: always()
        run: |
          set -o pipefail
          B="$PWD/target/release/romcrate-cli"
          I="$RUNNER_TEMP/sim/import"
          python tools/simulate/make_messy.py "$I"
          cp -R "$I/Downloads" "$I/Downloads2"
          cd "$I"
          "$B" check Downloads > 0-check.log 2>&1 && echo 0 > 0-check.exit || echo $? > 0-check.exit
          cat 0-check.log
          "$B" import --from Downloads --to "ROMs sorted"                               2>&1 | tee 1-import-preview.log
          "$B" import --from Downloads --to "ROMs sorted" --skip mystery.dat2 --yes      2>&1 | tee 2-import.log
          "$B" import --from Downloads --to "ROMs sorted" --skip mystery.dat2 --yes      2>&1 | tee 3-import-rerun.log
          "$B" import --from Downloads2 --to "ROMs moved" --move --skip mystery.dat2 --yes 2>&1 | tee 4-import-move.log
          "$B" scrape --roms "ROMs sorted" --launcher pegasus --systems ps2,psx --no-launchbox 2>&1 | tee 5-scrape-sorted.log

      - name: Check import results
        if: always()
        run: python tools/simulate/check_import.py "$RUNNER_TEMP/sim/import" | tee "$RUNNER_TEMP/sim/import/6-check.log"
      - name: Publish results for review (branch sim-results/cli-${{ matrix.os }})
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python tools/simulate/collect.py "$RUNNER_TEMP/sim" "$RUNNER_TEMP/pub" --covers
          cd "$RUNNER_TEMP/pub"
          git init -q && git add -A
          git -c user.name=simulation -c user.email=simulation@users.noreply.github.com commit -qm "Simulation results ${{ github.run_id }}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/sim-results/cli-${{ matrix.os }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: cli-${{ matrix.os }}
          path: ${{ runner.temp }}/sim
          retention-days: 14

  old-linux:
    name: CLI on Ubuntu 20.10 (static build)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release -p romcrate-cli --target x86_64-unknown-linux-musl
      - name: Run inside Ubuntu 20.10
        run: |
          python3 -m pip install --quiet pycdlib
          python3 tools/simulate/make_fixtures.py "$RUNNER_TEMP/sim/roms"
          cp target/x86_64-unknown-linux-musl/release/romcrate-cli "$RUNNER_TEMP/sim/"
          docker run --rm -v "$RUNNER_TEMP/sim:/sim" ubuntu:20.10 bash -c '
            set -e; cat /etc/os-release | head -2
            /sim/romcrate-cli scan /sim/roms
            /sim/romcrate-cli scrape --roms /sim/roms --launcher pegasus --systems snes,nes --no-launchbox
          ' 2>&1 | tee "$RUNNER_TEMP/sim/ubuntu-20.10.log"

  gui:
    name: App window (${{ matrix.os }})
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf webkit2gtk-driver xvfb
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Build app
        run: |
          npm ci
          npx tauri build --no-bundle
      - name: Make test collection
        run: |
          python -m pip install --quiet pycdlib selenium
          python tools/simulate/make_fixtures.py "$RUNNER_TEMP/sim/$ROMS_NAME"
          python tools/simulate/make_messy.py "$RUNNER_TEMP/sim/import"
          mkdir -p "$RUNNER_TEMP/sim/gui"

      - name: Launch the app and screenshot it (Windows)
        # Microsoft's WebView2 driver can't attach on GitHub's Windows machines
        # ("DevToolsActivePort"), so Windows gets a launch + real screenshot; the full
        # click-through runs on Linux with the same interface.
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $out = "$env:RUNNER_TEMP\sim\gui"
          $p = Start-Process "$env:GITHUB_WORKSPACE\target\release\romcrate.exe" -PassThru
          Start-Sleep 20
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("$out\01-first-launch.png")
          if ($p.HasExited) { "app exited/crashed on launch (code $($p.ExitCode))" | Tee-Object "$out\gui-problems.txt"; exit 1 }
          "app still running after 20s: OK" | Tee-Object "$out\gui-problems.txt"
          Stop-Process $p

      - name: Drive the app (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo install tauri-driver --locked
          export DISPLAY=:99
          Xvfb :99 -screen 0 1400x1000x24 &
          sleep 2
          tauri-driver &
          sleep 5
          python tools/simulate/drive_gui.py "$GITHUB_WORKSPACE/target/release/romcrate" "$RUNNER_TEMP/sim/$ROMS_NAME" "$RUNNER_TEMP/sim/gui" "$RUNNER_TEMP/sim/import"

      - name: Launch the app (macOS — no WebDriver for macOS webviews, so launch + screenshot only)
        if: runner.os == 'macOS'
        run: |
          ./target/release/romcrate > "$RUNNER_TEMP/sim/gui/app-output.log" 2>&1 &
          PID=$!
          sleep 20
          screencapture -x "$RUNNER_TEMP/sim/gui/01-first-launch.png" || echo "screencapture not permitted"
          if kill -0 $PID; then echo "app still running after 20s: OK" | tee "$RUNNER_TEMP/sim/gui/gui-problems.txt"; kill $PID;
          else echo "app exited/crashed on launch" | tee "$RUNNER_TEMP/sim/gui/gui-problems.txt"; exit 1; fi

      - name: Check results
        if: always() && runner.os == 'Linux'
        run: |
          python tools/simulate/check.py "$RUNNER_TEMP/sim" --gui | tee "$RUNNER_TEMP/sim/gui/check.log"
          python tools/simulate/check_import.py "$RUNNER_TEMP/sim/import" --gui | tee "$RUNNER_TEMP/sim/gui/check-import.log"
      - name: Publish results for review (branch sim-results/gui-${{ matrix.os }})
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python tools/simulate/collect.py "$RUNNER_TEMP/sim" "$RUNNER_TEMP/pub" 
          cd "$RUNNER_TEMP/pub"
          git init -q && git add -A
          git -c user.name=simulation -c user.email=simulation@users.noreply.github.com commit -qm "Simulation results ${{ github.run_id }}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/sim-results/gui-${{ matrix.os }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: gui-${{ matrix.os }}
          path: ${{ runner.temp }}/sim
          retention-days: 14

  installer:
    name: Released installer starts (Windows)
    runs-on: windows-latest
    steps:
      - name: Install latest release silently and launch it
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download -R $env:GITHUB_REPOSITORY -p "*_x64-setup.exe" -D $env:RUNNER_TEMP
          $setup = Get-ChildItem $env:RUNNER_TEMP -Filter *_x64-setup.exe | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList "/S" -Wait
          $exe = Get-ChildItem "$env:LOCALAPPDATA\RomCrate","$env:ProgramFiles\RomCrate","$env:LOCALAPPDATA\ShelfArt","$env:ProgramFiles\ShelfArt" -Include romcrate.exe,shelfart.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { throw "installer did not put romcrate.exe where expected" }
          "installed at $($exe.FullName)"
          $p = Start-Process $exe.FullName -PassThru
          Start-Sleep 20
          if ($p.HasExited) { throw "app exited within 20s (code $($p.ExitCode))" }
          "app is running after 20s: OK"
          Stop-Process $p

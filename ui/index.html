<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RomCrate</title>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="brand">
          <div class="logo" aria-hidden="true"><span></span><span></span><span></span></div>
          <div>
            <div class="brand-name">RomCrate</div>
            <div class="brand-sub">No account. No tracking.</div>
          </div>
        </div>
        <nav class="steps" id="steps"></nav>
        <div class="tools">
          <div class="tools-label">Tools</div>
          <button class="tool" id="nav-import"><span>📥</span> Import &amp; sort games</button>
        </div>
        <div class="sidebar-foot">
          <button class="link" id="nav-settings">Settings &amp; privacy</button>
          <div class="version" id="version"></div>
        </div>
      </aside>
      <main class="main" id="main"></main>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RomCrate</title>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="brand">
          <div class="logo" aria-hidden="true"><span></span><span></span><span></span></div>
          <div>
            <div class="brand-name">RomCrate</div>
            <div class="brand-sub">No account, no tracking</div>
          </div>
        </div>
        <button class="device-chip" id="nav-device" title="Change the device your games are for"></button>
        <button class="tool" id="nav-home" data-icon="home">Home</button>
        <div class="tools-label">Set up everything</div>
        <nav class="steps" id="steps"></nav>
        <div class="tools">
          <div class="tools-label">One task at a time</div>
          <button class="tool" id="nav-check" data-icon="check">Check my files</button>
          <button class="tool" id="nav-import" data-icon="import">Import and sort games</button>
          <button class="tool" id="nav-art" data-icon="art">Get artwork</button>
          <button class="tool" id="nav-pegasus" data-icon="pegasus">Pegasus launch lines</button>
          <button class="tool" id="nav-send" data-icon="send">Send to handheld</button>
          <button class="tool" id="nav-tune" data-icon="tune">Game settings</button>
        </div>
        <div class="sidebar-foot">
          <button class="tool" id="nav-settings" data-icon="settings">Settings and privacy</button>
          <div class="version" id="version"></div>
        </div>
      </aside>
      <main class="main" id="main"></main>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>

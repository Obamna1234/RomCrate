<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RomCrate</title>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="brand">
          <div class="logo" aria-hidden="true"><span></span><span></span><span></span></div>
          <div>
            <div class="brand-name">RomCrate</div>
            <div class="brand-sub">No account. No tracking.</div>
          </div>
        </div>
        <button class="device-chip" id="nav-device" title="Change the device your games are for"></button>
        <button class="tool" id="nav-home"><span>🏠</span> Home</button>
        <div class="tools-label" style="margin-top:14px">Set up everything</div>
        <nav class="steps" id="steps"></nav>
        <div class="tools">
          <div class="tools-label">Custom — one task at a time</div>
          <button class="tool" id="nav-check"><span>🩺</span> Check my files</button>
          <button class="tool" id="nav-import"><span>📥</span> Import &amp; sort games</button>
          <button class="tool" id="nav-art"><span>🖼️</span> Get artwork</button>
          <button class="tool" id="nav-pegasus"><span>🚀</span> Pegasus launch lines</button>
          <button class="tool" id="nav-send"><span>📲</span> Send to handheld</button>
          <button class="tool" id="nav-tune"><span>🎛️</span> Game settings</button>
          <button class="tool soon" disabled title="Coming in the next version"><span>🗜️</span> Compress discs <em>soon</em></button>
          <button class="tool soon" disabled title="Coming soon"><span>✅</span> Device setup checklist <em>soon</em></button>
        </div>
        <div class="sidebar-foot">
          <button class="link" id="nav-settings">Settings &amp; privacy</button>
          <div class="version" id="version"></div>
        </div>
      </aside>
      <main class="main" id="main"></main>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>

[package]
name = "romcrate-core"
description = "Account-free, privacy-first game artwork scraper engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
crc32fast = "1"
quick-xml = "0.42"
zip = { version = "9", default-features = false, features = ["deflate", "deflate64"] }
fs4 = { version = "1.1", features = ["sync"] }
tempfile = "3"
md5 = { package = "md-5", version = "0.10" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
anyhow.workspace = true
thiserror = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "stream"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
strsim = "0.11"
deunicode = "1"
dirs = "7"
roxmltree = "0.21"
percent-encoding = "2"
futures = "0.3"
url = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[dev-dependencies]
tempfile = "3"
